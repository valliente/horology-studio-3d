name: Build & Release Horology Studio 3D EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    name: Build Native Qt 6 C++ 3D Customizer & Release EXE
    runs-on: windows-2022

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup MSVC Developer Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt 6.8 & Quick 3D
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.8.*'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtquick3d'

      - name: Setup CMake & Ninja
        uses: jasonallen7/setup-ninja@v1.0.2

      - name: Configure CMake
        run: |
          cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release

      - name: Build C++ Executable
        run: |
          cmake --build build --config Release

      - name: Package Qt Dependencies (windeployqt)
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist
          if (Test-Path build/HorologyStudio3D.exe) {
              Copy-Item build/HorologyStudio3D.exe dist/
          } elseif (Test-Path build/Release/HorologyStudio3D.exe) {
              Copy-Item build/Release/HorologyStudio3D.exe dist/
          }
          & windeployqt --qmldir qml --compiler-runtime --quick --no-translations dist/HorologyStudio3D.exe
          Copy-Item -Path qml -Destination dist/qml -Recurse -Force

      - name: Compress Executable Package
        shell: powershell
        run: |
          Compress-Archive -Path dist/* -DestinationPath HorologyStudio3D-Windows-x64.zip -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            HorologyStudio3D-Windows-x64.zip
            dist/HorologyStudio3D.exe
          name: Horology Studio 3D ${{ github.ref_name }}
          body: |
            ## ⌚ Horology Studio 3D - Native C++20 / Qt 6 Engine Release
            
            ### Package Contents:
            - `HorologyStudio3D-Windows-x64.zip`: Full release bundle with all Qt Quick 3D DLLs & QML assets.
            - `HorologyStudio3D.exe`: Direct executable binary.
            
            ### Features Included:
            - Native Qt 6 Quick 3D Engine with PBR materials.
            - Real-time C++ Watch Dial Texture Mapper with native image upload dialog.
            - Interactive 360° Viewport Orbit Camera (Rotate/Pan/Zoom).
            - Dynamic Strap Material Variants (Vintage Leather, NATO Fabric, Milanese Loop, Rubber).
            - Expensio Pro Dark UI Dashboard interface.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
